<head>

<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15222F; --ink-2:#3F5264; --muted:#687A8B;
  --line:#D3DCE3; --brand:#123E6B; --brand-ink:#FFFFFF; --focus:#2F7DD1;
  --danger:#B42318; --danger-bg:#FCEBE9; --warn:#8A5A00; --warn-bg:#FFF3D6; --ok:#2F6B4A; --ok-bg:#E6F2EB;
  --radius:6px; --font:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1720; --surface:#16212C; --surface-2:#1C2935; --ink:#E5ECF2; --ink-2:#B5C3CF; --muted:#8798A7;
    --line:#2B3A47; --brand:#6AA6DD; --brand-ink:#0F1720; --focus:#7DB7EC;
    --danger:#F08A80; --danger-bg:#3A1F1E; --warn:#E5B85A; --warn-bg:#352B12; --ok:#7CC39A; --ok-bg:#16301F;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--brand);color:var(--brand-ink);flex-wrap:wrap}
.marca{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.marca strong{font-size:1.05rem}
.marca span{font-size:.82rem;opacity:.85}
.demo{font-size:.82rem;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:var(--radius)}
.demo select{background:var(--surface);color:var(--ink);border:0;border-radius:4px;padding:2px 4px;max-width:240px}
.quien{display:flex;flex-direction:column;text-align:right;line-height:1.2}
.quien small{opacity:.85;font-size:.8rem}
.top .btn.ghost{color:var(--brand-ink);border-color:rgba(255,255,255,.45)}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--radius);color:var(--ink-2)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.main{padding:24px 28px 48px;min-width:0}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cab p{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.prim{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.prim:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.peligro{color:var(--danger);border-color:currentColor;background:transparent}
.btn.link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.aviso{padding:10px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);margin-bottom:16px}
.aviso.error{background:var(--danger-bg);color:var(--danger)}
.resumen{display:flex;gap:28px;flex-wrap:wrap;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.resumen div{display:flex;flex-direction:column}
.resumen b{font-size:1.35rem;font-weight:600}
.resumen span{color:var(--muted);font-size:.85rem}
.resumen .alto b{color:var(--danger)}
.bloque{margin-bottom:28px}
.bloque > h2{margin-bottom:10px}
.vacio{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
/* Flujo por etapa */
.flujo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:0;overflow-x:auto;padding-bottom:6px}
.carril{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);padding:12px;min-height:180px;position:relative;margin-right:22px}
.carril:not(:last-child)::after{content:"";position:absolute;right:-17px;top:28px;border:7px solid transparent;border-left:9px solid var(--line)}
.carril header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.carril .cuenta{font-size:1.6rem;font-weight:600;color:var(--c)}
.carril .sub{color:var(--muted);font-size:.83rem;margin:2px 0 10px}
.carril.final{min-height:0;align-self:start}
.pila{display:flex;flex-direction:column;gap:8px}
.tarjeta{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--c, var(--line));border-radius:4px;background:var(--surface-2)}
.tarjeta:hover{border-color:var(--ink-2)}
.tarjeta:focus-visible{outline:2px solid var(--focus)}
.tarjeta .num{font-weight:600;font-size:.88rem}
.tarjeta .tit{font-size:.92rem}
.tarjeta .meta{font-size:.8rem;color:var(--muted)}
.chip{display:inline-block;align-self:flex-start;font-size:.75rem;padding:1px 7px;border-radius:10px;margin-top:3px;background:var(--surface);border:1px solid var(--line)}
.chip.vencido{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.porvencer{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap}
.estado::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
/* Tablas */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.filtros label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:3px}
.filtros input,.filtros select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.filtros .q{flex:1 1 220px}
.filtros .check{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:.9rem;padding-bottom:6px}
.tabla-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .rojo{color:var(--danger);font-weight:500}
.cuenta-res{color:var(--muted);font-size:.85rem;margin:8px 2px}
/* Indicadores */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.panel h3{margin-bottom:10px}
.barra{display:grid;grid-template-columns:minmax(110px,40%) 1fr 34px;gap:10px;align-items:center;font-size:.86rem;padding:3px 0}
.barra .pista{height:12px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.barra .pista i{display:block;height:100%;background:var(--brand)}
.barra .pista i.gris{background:var(--muted)}
.barra b{text-align:right;font-weight:600}
.meses{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.meses div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.72rem;color:var(--muted);min-width:14px}
.meses div i{width:100%;max-width:28px;background:var(--brand);border-radius:2px 2px 0 0;min-height:1px}
.meses div b{color:var(--ink);font-weight:500}
/* Panel de caso */
.fondo{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.2)}
.drawer > header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:flex-start}
.drawer > header .t{margin-right:auto}
.drawer > header .t p{color:var(--muted);font-size:.85rem;margin-top:2px}
.cuerpo{overflow-y:auto;padding:18px 20px 30px;flex:1}
.pasos{display:flex;gap:0;margin-bottom:18px}
.pasos li{list-style:none;flex:1;padding:8px 10px;border-top:3px solid var(--line);font-size:.83rem;color:var(--muted)}
.pasos li b{display:block;color:var(--ink-2);font-weight:600}
.pasos li.hecho{border-color:var(--ok)}
.pasos li.actual{border-color:var(--brand)}
.pasos li.actual b{color:var(--ink)}
.pasos ol,.pasos{padding:0}
.seccion{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.seccion > header{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seccion > header span{font-size:.83rem;color:var(--muted)}
.seccion.bloqueada{background:var(--surface-2)}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;padding:14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.ancho{grid-column:1/-1}
.campo label{font-size:.83rem;color:var(--ink-2);font-weight:500}
.campo label .req{color:var(--danger);margin-left:2px}
.campo input,.campo select,.campo textarea{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%}
.campo textarea{min-height:76px;resize:vertical}
.campo .ayuda{font-size:.76rem;color:var(--muted)}
.campo .valor{padding:6px 0;white-space:pre-wrap;word-break:break-word}
.campo .valor.nada{color:var(--muted)}
.campo.invalido input,.campo.invalido select,.campo.invalido textarea{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.errores{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius);margin-bottom:14px}
.errores ul{margin:6px 0 0;padding-left:18px}
.drawer > footer{background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drawer > footer .sep{margin-left:auto}
.hist td{font-size:.84rem}
.hist .cambio{display:block}
/* Admin */
.admin-grid input{border:1px solid transparent;background:transparent;padding:4px 6px;width:100%;min-width:90px;border-radius:3px}
.admin-grid input:hover{border-color:var(--line)}
.admin-grid input:focus{border-color:var(--focus);background:var(--surface)}
.admin-grid tr.sucio td{background:var(--warn-bg)}
.admin-grid td{padding:3px 6px}
/* Pantallas */
.pantalla{min-height:100vh;display:grid;place-items:center;padding:24px}
.pantalla .caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:460px;width:100%}
.pantalla .caja h1{margin-bottom:8px}
.pantalla .caja p{color:var(--ink-2);margin-bottom:16px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast div.error{background:var(--danger);color:#fff}
.ocupado{position:fixed;inset:0;z-index:30;background:rgba(10,20,30,.25);display:grid;place-items:center}
.ocupado span{background:var(--surface);padding:12px 18px;border-radius:var(--radius);border:1px solid var(--line)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .demo{flex-wrap:wrap}
  .demo select{max-width:100%}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brand)}
  .main{padding:16px}
  .campos{grid-template-columns:1fr}
  .quien{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function ahoraISO() { const d = new Date(); return `${hoyISO()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function serialAISO(n, conHora) {

  return conHora ? `${iso}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` : iso;
}
function normFecha(v, conHora) {

  const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);

}

  return m ? new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0) : null;
}

  return /[T ]\d{2}:\d{2}/.test(s(v)) ? `${base} ${pad(d.getHours())}:${pad(d.getMinutes())}` : base;

const hoy0 = () => parseFecha(hoyISO());
const fmtNum = n => (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 });
const dias = (a, b) => Math.round((b - a) / 86400000);

/* Evita que un texto que empieza con = + - @ se tome como fórmula en Excel */

const filaObj = (headers, arr, i) => { const o = { _i: i }; headers.forEach((h, j) => { o[h] = arr[j]; }); return o; };
const noVacia = o => Object.keys(o).some(k => k !== '_i' && s(o[k]) !== '');

let msalApp = null, cuenta = null;
const BASE = () => `/sites/${CONFIG.siteId}/drive/items/${CONFIG.itemId}/workbook`;
const HEADERS = {};

async function tokenGraph() {
  const req = { scopes: CONFIG.scopes, account: cuenta };
  try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch (e) { return (await msalApp.acquireTokenPopup(req)).accessToken; }
}
async function graph(ruta, opt = {}) {
  const r = await fetch('https://graph.microsoft.com/v1.0' + ruta, {
    ...opt, headers: { Authorization: 'Bearer ' + await tokenGraph(), 'Content-Type': 'application/json', ...(opt.headers || {}) }
  });
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    try { const j = await r.json(); msg = (j.error && j.error.message) || msg; } catch (_) { }
    throw new Error('SharePoint respondió: ' + msg);
  }
  return r.status === 204 ? null : r.json();
}

const DBGraph = {
  async leer(n) {
    const r = await graph(`${BASE()}/tables('${n}')/range?$select=values`);
    const [cab, ...data] = r.values; const headers = cab.map(s); HEADERS[n] = headers;
    return { headers, rows: data.map((a, i) => filaObj(headers, a, i)).filter(noVacia) };
  },
  async cabeceras(n) {
    if (!HEADERS[n]) { const r = await graph(`${BASE()}/tables('${n}')/headerRowRange?$select=values`); HEADERS[n] = r.values[0].map(s); }
    return HEADERS[n];
  },
  async agregar(n, obj) {
    const h = await this.cabeceras(n);
    const r = await graph(`${BASE()}/tables('${n}')/rows/add`, { method: 'POST', body: JSON.stringify({ values: [h.map(x => obj[x] ?? '')] }) });
    return r.index;
  },
  async actualizar(n, i, obj) {
    const h = await this.cabeceras(n);
    await graph(`${BASE()}/tables('${n}')/rows/itemAt(index=${i})/range`, { method: 'PATCH', body: JSON.stringify({ values: [h.map(x => obj[x] ?? '')] }) });
  },
  async eliminar(n, i) {
    await graph(`${BASE()}/tables('${n}')/rows/$/itemAt(index=${i})`, { method: 'DELETE' });
  }
};

  async agregar(n, obj) { await pausa(); const t = MEM[n]; t.data.push(t.headers.map(h => obj[h] ?? '')); return t.data.length - 1; },

/* Numeración por orden de llegada de las filas: dos altas simultáneas no se pisan */
async function asignarNumero(id) {
  const tab = await DB.leer(T.casos);
  const filas = tab.rows.filter(r => s(r.ID));
  const pos = filas.findIndex(r => s(r.ID) === id);
  if (pos < 0) throw new Error('No se encontró el caso recién creado en TablaCasos.');
  const yo = filas[pos], anio = s(yo.Anio), pref = cfg('PrefijoNumero', 'TNC-') + anio + '-';
  let max = 0, sinNumero = 0;
  for (const r of filas.slice(0, pos)) {
    if (s(r.Anio) !== anio) continue;
    const n = s(r.Numero);
    if (!n) sinNumero++;
    else if (n.startsWith(pref) && /^\d+$/.test(n.slice(pref.length))) max = Math.max(max, +n.slice(pref.length));
  }
  return { numero: pref + String(max + sinNumero + 1).padStart(+cfg('DigitosNumero', '4') || 4, '0'), indice: yo._i };
}

function validar(accion, d) {

  CAT.campos.forEach(f => { if (f.obligatorio.has(accion) && f.tipo !== 'calculado' && incompleto(d[f.clave])) add(f.clave, `Falta completar: ${f.etiqueta}.`); });

async function verificarVersion(c) {

async function crearCaso(datos) {
  const ahora = ahoraISO();
  const c = {
    ID: uuid(), Numero: '', Anio: String((parseFecha(datos.FechaDeteccion) || new Date()).getFullYear()), Estado: estadoInicial().estado,
    CreadoPor: USER.nombre, CreadoEl: ahora, ModificadoPor: USER.nombre, ModificadoEl: ahora, Version: 1, datos
  };
  await DB.agregar(T.casos, casoAFila(c));
  const { numero, indice } = await asignarNumero(c.ID);
  c.Numero = numero; c._i = indice;
  await DB.actualizar(T.casos, indice, casoAFila(c));
  APP.casos.push(c);
  await registrarLog(c, 'crear', { Estado: ['', c.Estado] });
  return c;
}
async function guardarCaso(c, datos, nuevoEstado, accion) {
  const cambios = diferencias(c.datos, datos);
  if (nuevoEstado && nuevoEstado !== c.Estado) cambios.Estado = [c.Estado, nuevoEstado];
  if (!Object.keys(cambios).length) { toast('No hay cambios para guardar.'); return false; }
  await verificarVersion(c);
  const nuevo = { ...c, datos, Estado: nuevoEstado || c.Estado, Version: c.Version + 1, ModificadoPor: USER.nombre, ModificadoEl: ahoraISO() };
  await DB.actualizar(T.casos, c._i, casoAFila(nuevo));
  Object.assign(c, nuevo);
  await registrarLog(c, accion, cambios);
  return true;
}
async function reasignarNumero(c) {

  const { numero, indice } = await asignarNumero(c.ID);
  c.Numero = numero; c._i = indice; c.Version += 1; c.ModificadoPor = USER.nombre; c.ModificadoEl = ahoraISO();

}

function situacion(c) {
  if (esFinal(c)) return '';
  const fo = parseFecha(c.datos.FechaObjetivo); if (!fo) return '';
  const d = dias(hoy0(), fo);
  if (d < 0) return 'vencido';
  if (d <= (+cfg('DiasAlertaVencimiento', '3') || 0)) return 'porvencer';
  return '';
}
const porUrgencia = (a, b) => {
  const r = x => ({ vencido: 0, porvencer: 1 }[situacion(x)] ?? 2);
  return r(a) - r(b) || s(a.datos.FechaObjetivo || '9999').localeCompare(s(b.datos.FechaObjetivo || '9999')) || s(a.datos.FechaDeteccion).localeCompare(s(b.datos.FechaDeteccion));
};
const colorEstado = nombre => (estadoDe(nombre) || {}).color || 'var(--muted)';
const estadoHTML = nombre => `<span class="estado" style="--c:${esc(colorEstado(nombre))}">${esc(nombre)}</span>`;

function tarjeta(c) {
  const sit = situacion(c), det = parseFecha(c.datos.FechaDeteccion);
  const antig = det ? dias(det, hoy0()) : null;
  return `<button class="tarjeta" style="--c:${esc(colorEstado(c.Estado))}" data-act="abrir" data-id="${esc(c.ID)}">
    <span class="num">${esc(c.Numero || 'Sin número')}</span>

    ${sit ? `<span class="chip ${sit}">${sit === 'vencido' ? 'Venció' : 'Vence'} el ${esc(fmtFecha(c.datos.FechaObjetivo))}</span>` : ''}
  </button>`;
}

function promedioCierre(lst) {

}

function filtrarCasos() {
  const f = APP.filtros, q = low(f.q);

    if (f.estado && c.Estado !== f.estado) return false;

    if (f.clasificacion && (f.clasificacion === '(vacío)' ? !incompleto(d.Clasificacion) : d.Clasificacion !== f.clasificacion)) return false;
    if (f.desde && s(d.FechaDeteccion) < f.desde) return false;
    if (f.hasta && s(d.FechaDeteccion) > f.hasta) return false;
    if (f.vencidos && situacion(c) !== 'vencido') return false;
    if (q) {
      const txt = low([c.Numero, d.EnsayoProceso, d.Equipo, d.Matriz, d.Solicitud, d.QuePaso, d.DetectadoPor, d.Responsable].join(' '));
      if (!txt.includes(q)) return false;

}

/* ---------- Indicadores ---------- */
function agrupar(lst, clave, base, vacioEtiq, top) {
  const m = new Map((base || []).filter(v => !incompleto(v)).map(v => [v, 0])); let vacios = 0;
  lst.forEach(c => { const v = s(c.datos[clave]); if (incompleto(v)) vacios++; else m.set(v, (m.get(v) || 0) + 1); });
  let arr = [...m.entries()];
  if (top) arr = arr.filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, top);
  if (vacios || (base && base.length)) arr.push([vacioEtiq, vacios, true]);
  return arr;
}
function barras(titulo, arr) {
  const max = Math.max(1, ...arr.map(x => x[1]));
  return `<div class="panel"><h3>${esc(titulo)}</h3>${arr.length ? arr.map(([k, v, gris]) => `<div class="barra"><span>${esc(k)}</span><span class="pista"><i class="${gris ? 'gris' : ''}" style="width:${(v / max) * 100}%"></i></span><b>${v}</b></div>`).join('') : '<p class="sub">Sin datos.</p>'}</div>`;
}
function vistaIndicadores() {

  const { desde, hasta } = APP.ind;
  const lst = casosVisibles().filter(c => { const f = s(c.datos.FechaDeteccion); return f && f >= desde && f <= hasta; });
  const abiertos = lst.filter(c => !esFinal(c)), cerrados = lst.filter(esFinal);
  const venc = abiertos.filter(c => situacion(c) === 'vencido').length;
  const horas = lst.reduce((t, c) => t + (parseFloat(c.datos.HorasInterrupcion) || 0), 0);
  const conAC = lst.filter(c => si(c.datos.RequiereAC)).length;
  const prom = promedioCierre(cerrados);
  const L = n => (CAT.listas[n] || []).map(x => x.valor);
  // meses
  const meses = []; let d = parseFecha(desde); const fin = parseFecha(hasta);
  while (d && fin && d <= fin && meses.length < 36) { meses.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  const porMes = meses.map(m => [m, lst.filter(c => s(c.datos.FechaDeteccion).startsWith(m)).length]);
  const maxMes = Math.max(1, ...porMes.map(x => x[1]));
  const nombreMes = m => ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][+m.slice(5) - 1] + (meses.length > 12 ? ' ' + m.slice(2, 4) : '');
  return `<div class="cab"><div><h1>Indicadores</h1><p>Casos por fecha de detección${alcanceTodos('ver') ? '' : ', de ' + esc(USER.sectores.join(', '))}.</p></div></div>
    <div class="filtros">
      <label>Desde<input type="date" data-ind="desde" value="${esc(desde)}"></label>
      <label>Hasta<input type="date" data-ind="hasta" value="${esc(hasta)}"></label>
      <button class="btn ghost" data-act="ind-anio" data-y="${y}">Año ${y}</button>
      <button class="btn ghost" data-act="ind-anio" data-y="${y - 1}">Año ${y - 1}</button>
    </div>
    <div class="resumen">
      <div><b>${lst.length}</b><span>Casos en el período</span></div>
      <div><b>${abiertos.length}</b><span>Abiertos</span></div>
      <div class="${venc ? 'alto' : ''}"><b>${venc}</b><span>Abiertos vencidos</span></div>

      <div><b>${fmtNum(prom)}</b><span>Días promedio hasta el cierre</span></div>

      <div><b>${conAC}</b><span>Requieren acción correctiva</span></div>

        <div class="meses">${porMes.map(([m, v]) => `<div title="${esc(m)}: ${v}"><b>${v || ''}</b><i style="height:${(v / maxMes) * 100}%"></i><span>${nombreMes(m)}</span></div>`).join('')}</div></div>
      ${barras('Clasificación', agrupar(lst, 'Clasificacion', L('Clasificacion'), 'Pendiente de clasificar'))}
      ${barras('Estado', CAT.estados.map(e => [e.estado, lst.filter(c => c.Estado === e.estado).length]))}
      ${barras('Tipo de desvío', agrupar(lst, 'TipoDesvio', L('TipoDesvio'), 'Sin tipo asignado'))}

      ${barras('Ensayos o procesos con más casos', agrupar(lst, 'EnsayoProceso', [], 'Sin ensayo', 10))}
      ${barras('Equipos con más casos', agrupar(lst, 'Equipo', [], 'Sin equipo asociado', 10))}
    </div>`;
}

async function cargarAdmin() {

  a.headers = r.headers.length ? r.headers : (SEED.cols[a.tabla] || []);

  a.filas = null; render();
}

    let txt = f.tipo === 'fecha' || f.tipo === 'fechahora' ? fmtFecha(v) : v;
    if (f.tipo === 'calculado' && v !== '') txt = fmtNum(v);
    return `<div class="campo${ancho}"><label>${esc(f.etiqueta)}${reqTxt}</label><div class="valor${txt ? '' : ' nada'}">${esc(txt || '—')}</div>${editable ? ayuda : ''}</div>`;
  }
  let ctrl;
  const attrs = `id="${id}" data-campo="${esc(f.clave)}"`;
  switch (f.tipo) {
    case 'textolargo': ctrl = `<textarea ${attrs}>${esc(v)}</textarea>`; break;
    case 'fecha': ctrl = `<input type="date" ${attrs} value="${esc(v.slice(0, 10))}">`; break;
    case 'fechahora': ctrl = `<input type="datetime-local" ${attrs} value="${esc(v.slice(0, 16))}">`; break;
    case 'lista': {
      const ops = opcionesLista(f, d); if (v && !ops.includes(v)) ops.unshift(v);
      ctrl = `<select ${attrs}><option value="">Elegir…</option>${ops.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    }
    case 'sugerencia': case 'usuario': {
      const ops = f.tipo === 'usuario' ? CAT.usuarios.filter(u => u.activo).map(u => u.nombre) : opcionesLista(f, d);
      ctrl = `<input ${attrs} list="dl_${esc(f.clave)}" value="${esc(v)}"><datalist id="dl_${esc(f.clave)}">${ops.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`; break;
    }
    default: ctrl = `<input ${attrs} value="${esc(v)}">`;
  }
  return `<div class="campo${ancho}${err}"><label for="${id}">${esc(f.etiqueta)}${reqTxt}</label>${ctrl}${ayuda}</div>`;
}
function etapasEditables() {
  const F = APP.form;
  if (F.nuevo) return new Set(puede('crear') ? ['alta'] : []);
  const e = estadoDe(F.caso.Estado) || { editables: [] };
  return new Set(e.editables.filter(et => puede('editar:' + et, F.caso)));
}
function drawerHTML() {
  const F = APP.form, c = F.caso, d = F.datos;
  const est = F.nuevo ? estadoInicial() : (estadoDe(c.Estado) || { estado: c.Estado, editables: [], final: false });
  const editables = etapasEditables();
  const acciones = F.nuevo ? ['crear'] : CAT.transiciones.filter(t => t.desde === c.Estado).map(t => t.accion);
  const actualIdx = F.nuevo ? 0 : (est.final ? CAT.etapas.length : Math.max(0, CAT.etapas.findIndex(e => e.etapa === est.editables[est.editables.length - 1])));
  const pasos = CAT.etapas.map((e, i) => `<li class="${i < actualIdx ? 'hecho' : i === actualIdx ? 'actual' : ''}"><b>${esc(e.titulo)}</b>${esc(e.quien)}</li>`).join('');
  const secciones = CAT.etapas.map(et => {
    const campos = CAT.campos.filter(f => f.etapa === et.etapa); if (!campos.length) return '';
    const ed = editables.has(et.etapa);
    if (F.nuevo && et.etapa !== 'alta' && !ed) return '';
    return `<section class="seccion${ed ? '' : ' bloqueada'}"><header><h3>${esc(et.titulo)}</h3><span>Completa: ${esc(et.quien)}${ed ? '' : '. Solo lectura para vos en este estado.'}</span></header>
      <div class="campos">${campos.map(f => campoHTML(f, d, ed, acciones)).join('')}</div></section>`;
  }).join('');
  const trs = F.nuevo ? [] : transicionesPara(c);
  const puedeGuardar = editables.size > 0;
  const titulo = F.nuevo ? 'Nuevo caso' : (c.Numero || 'Caso sin número');
  const sub = F.nuevo ? `Se numera al crearlo. Queda en "${esc(estadoInicial().estado)}".`
    : `Creado por ${esc(c.CreadoPor)} el ${esc(fmtFecha(c.CreadoEl))}. Última modificación: ${esc(c.ModificadoPor)}, ${esc(fmtFecha(c.ModificadoEl))}.`;
  const errores = F.errores.length ? `<div class="errores" role="alert"><b>Revisá estos datos antes de continuar:</b><ul>${F.errores.map(e => `<li>${esc(e.msg)}</li>`).join('')}</ul></div>` : '';
  const hist = F.historial ? historialHTML(F.historial) : '';
  return `<div class="fondo" data-act="cerrar-panel"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTit">
    <header><div class="t"><h2 id="drawerTit">${esc(titulo)}</h2><p>${sub}</p></div>${F.nuevo ? '' : estadoHTML(c.Estado)}
      <button class="btn ghost" data-act="cerrar-panel" aria-label="Cerrar el panel">Volver</button></header>
    <div class="cuerpo" id="drawerCuerpo">
      <ol class="pasos">${pasos}</ol>
      ${errores}${secciones}
      ${!F.nuevo ? `<section class="seccion"><header><h3>Historial</h3>${F.historial ? '' : '<button class="btn link" data-act="historial">Ver quién cambió qué</button>'}</header>${hist}</section>` : ''}
    </div>
    <footer>
      ${puedeGuardar ? `<button class="btn${trs.length ? '' : ' prim'}" data-act="guardar">${F.nuevo ? 'Crear caso' : 'Guardar cambios'}</button>` : ''}
      ${trs.map(t => `<button class="btn prim" data-act="transicion" data-accion="${esc(t.accion)}">${esc(t.etiqueta)}</button>`).join('')}
      ${!F.nuevo && !c.Numero && puede('admin') ? '<button class="btn" data-act="asignar-numero">Asignar número</button>' : ''}
      <span class="sep"></span>
      ${!puedeGuardar && !trs.length ? '<span class="cuenta-res">Solo lectura.</span>' : ''}
      ${!F.nuevo && puede('exportar', c) ? '<button class="btn ghost" data-act="exportar-uno">Exportar a Excel</button>' : ''}
    </footer>
  </div>`;
}
function historialHTML(regs) {
  if (!regs.length) return '<p class="sub" style="padding:12px 14px">Sin registros.</p>';
  return `<div class="tabla-wrap" style="border:0"><table class="hist"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Cambios</th></tr></thead><tbody>${regs.map(r => {
    let det = {}; try { det = JSON.parse(s(r.Detalle) || '{}'); } catch (e) { }
    const cambios = Object.entries(det).map(([k, v]) => Array.isArray(v)
      ? `<span class="cambio"><b>${esc(etiquetaDe(k))}</b>: ${esc((v[0] || '—').slice(0, 60))} → ${esc((v[1] || '—').slice(0, 60))}</span>` : `<span class="cambio">${esc(k)}: ${esc(v)}</span>`).join('');
    return `<tr><td>${esc(fmtFecha(normFecha(r.Fecha, true)))}</td><td>${esc(s(r.Usuario).replace(/^'/, '').replace(/<.*>/, ''))}</td><td>${esc(r.Accion)}</td><td>${cambios}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function pintarDrawer() {
  const viejo = $('#drawer'), scroll = viejo ? $('#drawerCuerpo').scrollTop : 0;
  $$('.fondo, #drawer').forEach(x => x.remove());
  const wrap = document.createElement('div'); wrap.innerHTML = drawerHTML();
  [...wrap.children].forEach(ch => document.body.appendChild(ch));
  $('#drawerCuerpo').scrollTop = scroll;
  if (!viejo) { const p = $('#drawer [data-campo]') || $('#drawer button'); if (p) p.focus(); }
}
function cerrarPanel() { APP.form = null; $$('.fondo, #drawer').forEach(x => x.remove()); }
function leerFormulario() {
  const F = APP.form, ed = etapasEditables();
  const d = { ...F.datos };
  $$('#drawer [data-campo]').forEach(el => { const f = campoDe(el.dataset.campo); if (f && ed.has(f.etapa)) d[f.clave] = s(el.value); });
  calcular(d);
  return d;
}
function abrirCaso(id) {
  const c = APP.casos.find(x => x.ID === id); if (!c) return;
  APP.form = { caso: c, nuevo: false, datos: { ...c.datos }, errores: [], historial: null };
  pintarDrawer();
}
function nuevoCaso() { APP.form = { caso: null, nuevo: true, datos: defaultsCreacion(), errores: [], historial: null }; pintarDrawer(); }
function mostrarErrores(errs) { APP.form.errores = errs; pintarDrawer(); $('#drawerCuerpo').scrollTop = 0; }

async function accionGuardar() {
  const F = APP.form, d = leerFormulario(); F.datos = d;
  const errs = validar(F.nuevo ? 'crear' : 'guardar', d);
  if (errs.length) return mostrarErrores(errs);
  F.errores = [];
  if (F.nuevo) {
    const c = await ocupado('Creando el caso…', () => crearCaso(d));
    if (!c) return;
    toast(`Se creó el caso ${c.Numero}.`);
    APP.form = { caso: c, nuevo: false, datos: { ...c.datos }, errores: [], historial: null };
  } else {
    const ok = await ocupado('Guardando…', () => guardarCaso(F.caso, d, null, 'editar'));
    if (!ok) return;
    toast('Cambios guardados.'); F.datos = { ...F.caso.datos }; F.historial = null;
  }
  repintarMain(); pintarDrawer();
}
async function accionTransicion(accion) {
  const F = APP.form, t = transicionesPara(F.caso).find(x => x.accion === accion); if (!t) return;
  const d = leerFormulario(); defaultsAccion(accion, d); calcular(d); F.datos = d;
  const errs = validar(accion, d);
  if (errs.length) return mostrarErrores(errs);
  F.errores = [];
  if (t.confirmacion && !confirm(t.confirmacion)) { pintarDrawer(); return; }
  const ok = await ocupado('Guardando…', () => guardarCaso(F.caso, d, t.hacia, accion));
  if (!ok) { pintarDrawer(); return; }
  toast(`${F.caso.Numero}: ${t.hacia}.`); F.datos = { ...F.caso.datos }; F.historial = null;
  repintarMain(); pintarDrawer();
}

/* =====================================================================
   8. EXPORTAR A EXCEL
   ===================================================================== */
function serialExcel(iso) {
  const d = parseFecha(iso); if (!d) return null;
  return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) - Date.UTC(1899, 11, 30)) / 86400000;
}
function exportar(casos, nombre) {
  if (!window.XLSX) { toast('No se pudo cargar la librería de Excel. Revisá la conexión y recargá.', 'error'); return; }
  const campos = CAT.campos;
  const head = ['N.º de registro', 'Estado', ...campos.map(f => f.etiqueta), 'Creado por', 'Creado el', 'Modificado por', 'Modificado el'];
  const tipos = ['texto', 'texto', ...campos.map(f => f.tipo), 'texto', 'fechahora', 'texto', 'fechahora'];
  const filas = casos.map(c => [c.Numero, c.Estado, ...campos.map(f => c.datos[f.clave] ?? ''), c.CreadoPor, c.CreadoEl, c.ModificadoPor, c.ModificadoEl]);
  const titulo = `${cfg('NombreLaboratorio', 'BCRlabs')} | ${cfg('CodigoFormulario', 'LFORM.1037')}${cfg('VersionFormulario') ? ' versión ' + cfg('VersionFormulario') : ''}. ${cfg('TituloFormulario', '')}`;
  const pie = `Exportado el ${fmtFecha(ahoraISO())} por ${USER.nombre}. ${casos.length} casos.`;
  const aoa = [[titulo], [pie], [], head, ...filas.map(r => r.map((v, j) => {
    if ((tipos[j] === 'fecha' || tipos[j] === 'fechahora') && parseFecha(v)) return serialExcel(v);
    if (tipos[j] === 'calculado' && v !== '' && !isNaN(+v)) return +v;
    return s(v);
  }))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const fila0 = 3;
  head.forEach((h, j) => {
    const ref = XLSX.utils.encode_cell({ r: fila0, c: j });
    ws[ref].s = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '123E6B' } }, alignment: { wrapText: true, vertical: 'center' } };
    for (let i = 0; i < filas.length; i++) {
      const cell = ws[XLSX.utils.encode_cell({ r: fila0 + 1 + i, c: j })]; if (!cell) continue;
      if (cell.t === 'n' && tipos[j] === 'fecha') cell.z = 'dd/mm/yyyy';
      if (cell.t === 'n' && tipos[j] === 'fechahora') cell.z = 'dd/mm/yyyy hh:mm';
      cell.s = { alignment: { wrapText: tipos[j] === 'textolargo', vertical: 'top' } };
    }
  });
  if (ws.A1) ws.A1.s = { font: { bold: true, sz: 12 } };
  ws['!cols'] = tipos.map(t => ({ wch: t === 'textolargo' ? 45 : t === 'fechahora' ? 17 : 18 }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ r: fila0, c: 0 }, { r: fila0 + Math.max(filas.length, 1), c: head.length - 1 }) };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Casos');
  XLSX.writeFile(wb, nombre || `LFORM1037_casos_${hoyISO()}.xlsx`);
}

/* =====================================================================
   9. PANTALLAS DE INICIO Y EVENTOS
   ===================================================================== */
function pantalla(titulo, texto, boton) {
  $('#app').innerHTML = `<div class="pantalla"><div class="caja"><h1>${esc(titulo)}</h1><p>${texto}</p>${boton || ''}</div></div>`;
}
const pantallaSinAcceso = () => pantalla('Sin acceso',
  `Tu cuenta (${esc(APP.emailCuenta)}) no está habilitada en LFORM.1037. Pedile al administrador que te agregue en TablaUsuarios con un rol y un sector.`,
  DEMO ? '' : '<button class="btn" data-act="salir">Salir</button>');

async function arrancar() {
  pantalla('Cargando…', 'Leyendo los datos de SharePoint.');
  try {
    await cargarTodo();
    identificar();
    if (!USER) return pantallaSinAcceso();
    render();
  } catch (e) {
    console.error(e);
    pantalla('No se pudieron cargar los datos', esc(e.message), '<button class="btn prim" data-act="reintentar">Reintentar</button>');
  }
}
async function iniciar() {
  if (DEMO) { iniciarMemoria(); return arrancar(); }
  if (!window.msal) return pantalla('Falta el inicio de sesión', 'No se pudo cargar la librería de Microsoft (MSAL). Revisá la conexión o si la red bloquea cdn.jsdelivr.net.');
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: CONFIG.redirectUri },
    cache: { cacheLocation: 'localStorage' }
  });
  if (msalApp.initialize) await msalApp.initialize();
  try { await msalApp.handleRedirectPromise(); } catch (e) { }
  cuenta = msalApp.getAllAccounts()[0] || null;
  if (!cuenta) return pantalla('LFORM.1037', 'Ingresá con tu cuenta de BCR para ver y cargar trabajos no conformes.', '<button class="btn prim" data-act="login">Ingresar con Microsoft</button>');
  arrancar();
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'login':
      try { const r = await msalApp.loginPopup({ scopes: CONFIG.scopes }); cuenta = r.account; arrancar(); }
      catch (e) { toast('No se pudo iniciar sesión: ' + e.message, 'error'); }
      break;
    case 'salir': if (msalApp) msalApp.logoutPopup({ account: cuenta }).catch(() => { }); break;
    case 'reintentar': arrancar(); break;
    case 'recargar':
      await ocupado('Recargando…', async () => { await cargarTodo(); identificar(); });
      if (!USER) return pantallaSinAcceso();
      APP.admin.filas = null;
      if (APP.form && !APP.form.nuevo) { const c = APP.casos.find(x => x.ID === APP.form.caso.ID); APP.form = c ? { caso: c, nuevo: false, datos: { ...c.datos }, errores: [], historial: null } : null; }
      render(); break;
    case 'vista':
      if (APP.vista === 'admin' && APP.admin.sucio.size && !confirm('Hay cambios sin guardar en Administración. ¿Salir igual?')) return;
      APP.vista = el.dataset.v; if (APP.vista === 'admin') APP.admin.filas = null; render(); break;
    case 'nuevo': nuevoCaso(); break;
    case 'abrir': abrirCaso(el.dataset.id); break;
    case 'cerrar-panel': cerrarPanel(); break;
    case 'guardar': accionGuardar(); break;
    case 'transicion': accionTransicion(el.dataset.accion); break;
    case 'historial': {
      const regs = await ocupado('Leyendo el historial…', () => DB.leer(T.log));
      if (!regs || !APP.form) return;
      APP.form.datos = leerFormulario();
      APP.form.historial = regs.rows.filter(r => s(r.CasoID) === APP.form.caso.ID).reverse();
      pintarDrawer(); break;
    }
    case 'asignar-numero': {
      const c = APP.form.caso;
      const ok = await ocupado('Asignando número…', async () => { await reasignarNumero(c); return true; });
      if (ok) { toast('Número asignado: ' + c.Numero); revisarIntegridad(); repintarMain(); pintarDrawer(); }
      break;
    }
    case 'ir-estado': APP.filtros = { ...APP.filtros, estado: el.dataset.estado, vencidos: false }; APP.vista = 'casos'; render(); break;
    case 'limpiar-filtros': APP.filtros = { q: '', estado: '', sector: '', clasificacion: '', desde: '', hasta: '', vencidos: false }; repintarMain(); break;
    case 'exportar': exportar(filtrarCasos()); break;
    case 'exportar-uno': exportar([APP.form.caso], `LFORM1037_${APP.form.caso.Numero || 'caso'}.xlsx`); break;
    case 'ind-anio': APP.ind = { desde: `${el.dataset.y}-01-01`, hasta: `${el.dataset.y}-12-31` }; repintarMain(); break;
    case 'admin-agregar': {
      const a = APP.admin, f = { _nuevo: true }; a.headers.forEach(h => { f[h] = ''; });
      if (a.headers.includes('Activo')) f.Activo = 'Sí';
      a.filas.push(f); a.sucio.add(a.filas.length - 1); a.buscar = ''; repintarMain();
      const ins = $$(`[data-admin-r="${a.filas.length - 1}"]`); if (ins[0]) ins[0].focus();
      break;
    }
    case 'admin-guardar': guardarAdmin(); break;
    case 'admin-descartar': APP.admin.filas = null; repintarMain(); break;
    case 'admin-borrar': {
      const a = APP.admin, f = a.filas[+el.dataset.r];
      if (a.sucio.size) { toast('Guardá o descartá los cambios antes de eliminar filas.', 'error'); return; }
      const desc = a.headers.slice(0, 3).map(h => f[h]).filter(Boolean).join(', ');
      if (!confirm(`¿Eliminar la fila "${desc}" de ${a.tabla}? No se puede deshacer.` + (a.headers.includes('Activo') ? ' Para dar de baja sin borrar, usá Activo = No.' : ''))) return;
      const ok = await ocupado('Eliminando…', async () => {
        await DB.eliminar(a.tabla, f._i);
        await registrarLog({ ID: '', Numero: a.tabla }, 'administración: eliminar fila', { fila: desc });
        await cargarTodo(); identificar(); return true;
      });
      if (ok) { if (!USER) return pantallaSinAcceso(); a.filas = null; render(); }
      break;
    }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && APP.form) cerrarPanel();
  if (ev.key === 'Enter' && ev.target.matches('tr[data-act="abrir"]')) abrirCaso(ev.target.dataset.id);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.filtro === 'q') { APP.filtros.q = el.value; $('#tablaCasos').innerHTML = tablaCasosHTML(); }
  if (el.id === 'adminBuscar') {
    APP.admin.buscar = el.value; const pos = el.selectionStart; repintarMain();
    const n = $('#adminBuscar'); n.focus(); n.setSelectionRange(pos, pos);
  }
  if (el.dataset.adminR !== undefined) {
    const a = APP.admin, i = +el.dataset.adminR; a.filas[i][el.dataset.adminH] = el.value;
    if (!a.sucio.has(i)) { a.sucio.add(i); el.closest('tr').classList.add('sucio'); const b = $('[data-act="admin-guardar"]'); b.disabled = false; b.textContent = `Guardar cambios (${a.sucio.size})`; $('[data-act="admin-descartar"]').disabled = false; }
    else { $('[data-act="admin-guardar"]').textContent = `Guardar cambios (${a.sucio.size})`; }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'demoUser') {
    if (APP.form) cerrarPanel();
    APP.demoEmail = el.value; identificar();
    if (APP.vista === 'admin' && !puede('admin')) APP.vista = 'inicio';
    APP.filtros.sector = ''; render(); return;
  }
  if (el.dataset.filtro && el.dataset.filtro !== 'q') {
    APP.filtros[el.dataset.filtro] = el.type === 'checkbox' ? el.checked : el.value;
    $('#tablaCasos').innerHTML = tablaCasosHTML(); return;
  }
  if (el.dataset.ind) { APP.ind[el.dataset.ind] = el.value; if (APP.ind.desde && APP.ind.hasta) repintarMain(); return; }
  if (el.id === 'adminTabla') {
    if (APP.admin.sucio.size && !confirm('Hay cambios sin guardar. ¿Cambiar de tabla igual?')) { el.value = APP.admin.tabla; return; }
    APP.admin = { tabla: el.value, filas: null, headers: [], sucio: new Set(), buscar: '' }; repintarMain(); return;
  }
  if (el.dataset.campo) {
    // Al cambiar una lista o una fecha se vuelve a dibujar: listas que dependen del sector, obligatorios condicionales y campos calculados
    const f = campoDe(el.dataset.campo);
    if (f && ['lista', 'fecha', 'fechahora'].includes(f.tipo)) {
      APP.form.datos = leerFormulario();
      if (f.clave === 'Sector') {
        CAT.campos.filter(x => x.tipo === 'lista' && x.lista !== 'Sector').forEach(x => {
          const v = s(APP.form.datos[x.clave]); if (v && !opcionesLista(x, APP.form.datos).includes(v)) APP.form.datos[x.clave] = '';
        });
      }
      const foco = el.dataset.campo; pintarDrawer();
      const n = $(`#drawer [data-campo="${foco}"]`); if (n) n.focus();
    }
  }
});
window.addEventListener('beforeunload', ev => { if (APP.admin.sucio.size) { ev.preventDefault(); ev.returnValue = ''; } });

iniciar();
</script>
